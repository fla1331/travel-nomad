<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Nomad - Explore o mundo. Destinos, roteiros e dicas de viagem para todas as aventuras.</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var idiomas = ['pt', 'en', 'es'];
            var lang = (navigator.language || navigator.userLanguage || 'pt').substring(0, 2);
            if (idiomas.includes(lang)) {
                window.location.href = '/' + lang + '/';
            }
        });
    </script>
</head>
<body>
    <h1>Travel Nomad</h1>
    <p>Explore o mundo com a gente. Destinos, roteiros e dicas de viagem para todos os estilos e bolsos.</p>
    <div class="lang-options">
        <a href="/pt/" class="lang-option">Português</a>
<a href="/en/" class="lang-option">English</a>
<a href="/es/" class="lang-option">Español</a>

    </div>
</body>
</html>
